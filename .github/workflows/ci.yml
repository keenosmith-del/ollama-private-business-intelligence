name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-runtime/requirements.txt

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Test and build JavaScript workspaces
        run: |
          npm test
          npm run build

      - name: Install Python dependencies
        run: python -m pip install -r ai-runtime/requirements.txt ruff==0.16.9

      - name: Lint, test, and compile Python services
        run: |
          ruff check --select E4,E9,F ai-runtime/app ai-runtime/tests scripts
          python -m pytest -q ai-runtime/tests
          python -m compileall -q ai-runtime/app ai-runtime/tests scripts

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
